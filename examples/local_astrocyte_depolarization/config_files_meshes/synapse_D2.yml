    - "dilate radius=2"
    - "smooth iterations=2 radius=2 labels='[864691135509288969]'"
    - "smooth iterations=2 radius=2 labels='[864691136144674612]'"
    - "smooth iterations=2 radius=2 labels='[864691135610629775]'"
